services:
  - type: web
    name: medikiosk
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BHASHINI_UDYAT_KEY
        sync: false
      - key: BHASHINI_INFERENCE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
